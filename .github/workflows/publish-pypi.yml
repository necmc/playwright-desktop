name: Publicar en PyPI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar y probar (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar etiqueta SemVer y versión del paquete
        run: |
          $tag = $env:GITHUB_REF_NAME
          $semverRegex = '^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*)?(?:\+[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*)?$'
          if ($tag -cnotmatch $semverRegex) {
            throw "La etiqueta '$tag' no cumple el formato SemVer (ej. v0.1.0 o 0.1.0)."
          }
          $tagVersion = $tag -replace '^v', ''

          $cargo = Get-Content -Raw 'lib/Cargo.toml'
          $cargoVersion = if ($cargo -match '(?m)^version\s*=\s*"([^"]+)"') { $Matches[1] } else { '' }
          if ($cargoVersion -ne $tagVersion) {
            throw "La versión en lib/Cargo.toml ('$cargoVersion') no coincide con la etiqueta '$tagVersion'."
          }
          Write-Host "Versión SemVer verificada: $tagVersion"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de compilación Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lib

      - name: Instalar dependencias de compilación y pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.16,<2" "playwright>=1.63,<2"

      - name: Ejecutar pruebas de Rust
        run: cargo test --manifest-path lib/Cargo.toml --workspace --locked

      - name: Compilar wheel y sdist
        run: .\lib\scripts\build_py.ps1

      - name: Probar wheel en Python
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP ("pw-desk-test-" + [guid]::NewGuid().ToString('N'))
          try {
            New-Item -ItemType Directory -Path $tmp | Out-Null
            $whl = (Get-ChildItem 'lib/dist/python/*.whl' | Select-Object -First 1).FullName
            python -m pip install --no-deps --quiet --target $tmp $whl
            if ($LASTEXITCODE -ne 0) { throw "Falló la instalación del wheel." }
            $env:PYTHONPATH = "$tmp;lib/python/tests"
            python -B -m unittest discover -s lib/python/tests -v
            if ($LASTEXITCODE -ne 0) { throw "Fallaron las pruebas de Python." }
          }
          finally {
            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          }

      - name: Subir artefactos de distribución
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            lib/dist/python/*.whl
            lib/dist/python/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-pypi:
    name: Publicar en PyPI con atestación
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Descargar artefactos de distribución
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publicar en PyPI (Trusted Publishing + PEP 740)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  github-release:
    name: Crear GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar artefactos de distribución
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          args=(release create "$tag" dist/*.whl dist/*.tar.gz --repo "${GITHUB_REPOSITORY}" --title "$tag" --generate-notes)
          if [[ "${tag%%+*}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
